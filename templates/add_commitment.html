<!DOCTYPE html>
<html>
<head>
    <title>Add Commitment</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet">
</head>
<body>
<div class="container mt-5">

<div class="text-center mb-5">
    <h1 class="fw-bold">
        Add Commitment
    </h1>

    <p class="text-muted">
        Create a new commitment and let AI generate a personalized execution plan.
    </p>
</div>

<div class="card">
    <div class="card-body p-4">

        <form method="post">

            <div class="mb-4">
                <label class="form-label fw-semibold">
                    Commitment Title
                </label>

                <input
                    type="text"
                    class="form-control"
                    name="title"
                    placeholder="e.g. Complete DBMS Exam Preparation"
                >
            </div>

            <div class="mb-4">
                <label class="form-label fw-semibold">
                    Description
                </label>

                <textarea
                    class="form-control"
                    name="description"
                    rows="4"
                    placeholder="Describe your goal, expectations, and requirements..."
                ></textarea>
            </div>

            <div class="mb-4">
                <label class="form-label fw-semibold">
                    Deadline
                </label>

                <input
                    type="date"
                    class="form-control"
                    name="deadline"
                >
            </div>

            <div class="mb-4">
                <label class="form-label fw-semibold">
                    Category
                </label>

                <select class="form-control" name="category">
                    <option value="Study">📚 Study</option>
                    <option value="work">💼 Work</option>
                    <option value="Personal">🏠 Personal</option>
                    <option value="finance">💰 Finance</option>
                </select>
            </div>

            <button class="btn btn-primary btn-lg w-100">
                🚀 Generate AI Plan
            </button>

        </form>

    </div>
</div>
</div>

</body>
</html>
