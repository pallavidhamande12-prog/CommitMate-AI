<!DOCTYPE html>
<html>
<head>
    <title>AI Failure Review</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet">
</head>
<body>

<div class="container mt-5">

    <div class="text-center mb-5">

        <h2 class="fw-bold">
            🧠 AI Failure Review
        </h2>

        <p class="text-muted">
            Help CommitMate AI learn from this outcome and improve future planning recommendations.
        </p>

    </div>

    <div class="card mb-4">

        <div class="card-body">

            <h5 class="mb-0">
                {{ commitment[1] }}
            </h5>

        </div>

    </div>

    <form method="POST"
          action="/submit_failure_feedback/{{ commitment[0] }}">

        <div class="card">

            <div class="card-body">

                <h5 class="mb-4">
                    What contributed to this commitment not being completed?
                </h5>

                {% for reason in reasons %}

                <div class="form-check mb-3">

                    <input
                        class="form-check-input"
                        type="checkbox"
                        name="reasons"
                        value="{{ reason }}"
                        id="reason{{ loop.index }}"
                    >

                    <label
                        class="form-check-label"
                        for="reason{{ loop.index }}"
                    >
                        {{ reason }}
                    </label>

                </div>

                {% endfor %}

            </div>

        </div>

        <div class="card mt-4">

            <div class="card-body">

                <label class="form-label fw-semibold">
                    Additional Comments (Optional)
                </label>

                <textarea
                    class="form-control"
                    name="other_reason"
                    rows="4"
                    placeholder="Provide any additional context that may help improve future planning..."
                ></textarea>

            </div>

        </div>

        <div class="mt-4">

            <button class="btn btn-danger btn-lg w-100">
                📤 Submit Feedback
            </button>

        </div>

    </form>

</div>

</body>
</html>
